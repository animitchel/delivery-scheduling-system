<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set your password — Scheduling App</title>
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/auth.js" defer></script>
    <script src="/js/password.js" defer></script>
</head>
<body>
<main class="login-card">
    <p class="brand">Scheduling App</p>
    <h1>Set your password</h1>
    <p>Enter your current or temporary password and choose a different password with at least 15 characters.</p>
    <form id="passwordForm">
        <label for="currentPassword">Current password</label>
        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" required>
        <button id="passwordButton" type="submit">Save password</button>
    </form>
    <p id="passwordMessage" role="status" aria-live="polite"></p>
    <button id="logoutButton" type="button">Sign out</button>
    <noscript>JavaScript is required to change your password securely.</noscript>
</main>
</body>
</html>
