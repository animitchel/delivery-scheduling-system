<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scheduling App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://kit.fontawesome.com/a2e0e6ad45.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">📦 Scheduling App</a>
            <a class="btn btn-outline-light" href="/app/admin/recipients">Recipients</a>
            <a class="btn btn-outline-light" href="/app/admin/routes">Routes</a>
            <a class="btn btn-outline-light" href="/app/admin/accounts">Accounts</a>
            <a class="btn btn-outline-light" href="/app/">Workspace</a>
        </div>
    </nav>
    <div class="container mb-3">
        <span id="sessionAccount"></span>
        <button id="logoutButton" class="btn btn-outline-secondary btn-sm" type="button">Sign out</button>
        <p id="sessionMessage" role="alert" hidden></p>
    </div>

    <div class="container flex-grow-1">

        <div class="row g-4">

            <!-- Route Generation Card -->
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-warning text-dark">
                        <i class="fas fa-route"></i> Generate Routes
                    </div>
                    <div class="card-body">
                        <form id="routeForm">
                            <div class="mb-3">
                                <label for="routeDate" class="form-label">Scheduled Date</label>
                                <input type="text" class="form-control" id="routeDate" placeholder="Select date" required>
                            </div>
                            <button type="submit" class="btn btn-warning">Generate Routes</button>
                        </form>
                        <div class="mt-3" id="routeResponse"></div>
                    </div>
                </div>
            </div>

            <!-- Recipient Card -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <i class="fas fa-user-plus"></i> Create Recipient
                    </div>
                    <div class="card-body">
                        <form id="recipientForm">
                            <div class="mb-3">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="mb-3">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <input type="text" class="form-control" id="address" required>
                            </div>
                            <div class="mb-3">
                                <label for="contactNumber" class="form-label">Contact Number</label>
                                <input type="text" class="form-control" id="contactNumber">
                            </div>
                            <div class="mb-3">
                                <label for="priorityLevelRecipient" class="form-label">Priority Level</label>
                                <select class="form-select" id="priorityLevelRecipient" required>
                                    <option value="LOW">Low</option>
                                    <option value="MEDIUM">Medium</option>
                                    <option value="HIGH">High</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success">Create Recipient</button>
                        </form>
                        <div class="mt-3" id="recipientResponse"></div>
                    </div>
                </div>
            </div>

            <!-- Delivery Card -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <i class="fas fa-truck"></i> Create Delivery
                    </div>
                    <div class="card-body">
                        <form id="deliveryForm">
                            <div class="mb-3">
                                <label for="operatorId" class="form-label">Select Operator</label>
                                <select class="form-select" id="operatorId" required></select>
                            </div>
                            <div class="mb-3">
                                <label for="recipientId" class="form-label">Select Recipient</label>
                                <select class="form-select" id="recipientId" required></select>
                            </div>
                            <div class="mb-3">
                                <label for="scheduledDate" class="form-label">Scheduled Date</label>
                                <input type="text" class="form-control" id="scheduledDate" placeholder="Select date" required>
                            </div>
                            <div class="mb-3">
                                <label for="startTimeWindow" class="form-label">Start Time Window</label>
                                <input type="text" class="form-control" id="startTimeWindow" placeholder="Select time" required>
                            </div>
                            <div class="mb-3">
                                <label for="endTimeWindow" class="form-label">End Time Window</label>
                                <input type="text" class="form-control" id="endTimeWindow" placeholder="Select time" required>
                            </div>
                            <div class="mb-3">
                                <label for="priorityLevel" class="form-label">Priority Level</label>
                                <select class="form-select" id="priorityLevel" required>
                                    <option value="LOW">Low</option>
                                    <option value="MEDIUM">Medium</option>
                                    <option value="HIGH">High</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="specialInstructions" class="form-label">Special Instructions</label>
                                <textarea class="form-control" id="specialInstructions" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Create Delivery</button>
                        </form>
                        <div class="mt-3" id="responseMessage"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-1">📦 Scheduling App — Streamline your deliveries with ease</p>
            <small>&copy; 2025 Scheduling App. All rights reserved.</small>
        </div>
    </footer>

    <!-- jQuery + custom JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>
</html>
