<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Scheduling App</title>
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/auth.js" defer></script>
    <script src="/js/login.js" defer></script>
</head>
<body>
    <main class="login-card">
        <p class="brand">Scheduling App</p>
        <h1>Sign in</h1>
        <p>Use the account provided by your administrator.</p>
        <form id="loginForm" action="/api/auth/login" method="post">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" maxlength="64" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="loginButton" type="submit">Sign in</button>
        </form>
        <p id="loginMessage" role="status" aria-live="polite"></p>
        <button id="logoutButton" type="button" hidden>Sign out</button>
        <noscript>JavaScript is required to sign in securely.</noscript>
    </main>
</body>
</html>
